[package]
name = "wpsite"
version = "0.1.0"
description = "GUI for wpsite command"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wpsite_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: set the Dock icon at runtime. In `tauri dev` the app runs as a bare
# debug binary (no .app bundle / Info.plist), so the bundle icon never applies and
# the Dock shows a generic icon. Setting NSApplication's icon at startup fixes that
# for dev (and is harmless in the bundled build). Versions pinned to match Tauri's
# own objc2 tree so no duplicate crate versions are pulled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

